name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze, test, build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.x
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          (cd packages/astro && dart pub get)

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool packages/astro/lib packages/astro/test

      - name: Analyze app
        run: flutter analyze

      - name: Analyze astro package
        working-directory: packages/astro
        run: dart analyze --fatal-infos

      - name: Test astro package
        working-directory: packages/astro
        run: dart test

      - name: Test app
        run: flutter test

      - name: Build web
        run: flutter build web --release --base-href /orrery-sky-atlas/ --no-web-resources-cdn

  android-apk:
    name: Build release APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.x
          cache: true

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: orrery-sky-atlas-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
